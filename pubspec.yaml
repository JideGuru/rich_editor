name: rich_editor
description: WYSIWYG editor for Flutter with a rich set of supported formatting options.
version: 0.5.0
homepage: https://github.com/JideGuru/rich_editor

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

# The editor runs in a native WebView and reads picked media through dart:io.
platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  image_picker: ^1.2.0
  flutter_colorpicker: ^1.1.0
  xml: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/editor/
